user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for static files and API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream backend pool: 2 stateless Fastify instances
    # max_fails=1 fail_timeout=2s ensures any unhealthy instance is pulled within 2 seconds
    upstream backend_servers {
        # Round-robin distribution
        server app1:3000 max_fails=1 fail_timeout=2s;
        server app2:3000 max_fails=1 fail_timeout=2s;
        keepalive 64;
    }

    # Upstream AI service (FastAPI)
    upstream ai_servers {
        server ai-service:8000 max_fails=1 fail_timeout=3s;
        keepalive 16;
    }

    # Upstream Frontend
    upstream frontend_servers {
        server frontend:5173 max_fails=1 fail_timeout=3s;
    }

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body size cap (protect against payload flooding)
        client_max_body_size 10M;

        # Failover configuration: proxy_next_upstream on error or timeout
        # Automatically retries on another upstream server if one is down
        proxy_next_upstream error timeout http_502 http_503 http_504 invalid_header non_idempotent;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 4s;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        # API routing
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # WebSocket endpoints (realtime heartbeats, invigilator fan-out, session replacement events)
        location /ws/ {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health check proxy
        location /healthz {
            proxy_pass http://backend_servers/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /readyz {
            proxy_pass http://backend_servers/readyz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Metrics proxy
        location /metrics {
            proxy_pass http://backend_servers/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # AI Collusion Detection Service proxy
        location /ai/ {
            proxy_pass http://ai_servers/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 5s;
        }

        # Candidate and Invigilator SPA frontend
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
