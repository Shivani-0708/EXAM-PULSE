# Redis Master Configuration for ExamPulse
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 4096
timeout 0
tcp-keepalive 300

# Persistence: Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Durability policy: 'everysec' by default for balanced high-throughput & safety.
# For strictly zero-RPO financial/grade durability, change to 'always'.
# Under 'everysec', Redis buffers writes to OS page cache and fsyncs every second.
# Under 'always', Redis executes fsync after every write command.
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshotting (RDB) as secondary backup
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Replication settings
# WAIT command support: require at least 1 replica acknowledged for durable writes
min-replicas-max-lag 10

# Memory management
maxmemory 2gb
maxmemory-policy noeviction

# Performance tuning for high concurrency
databases 16
loglevel notice
