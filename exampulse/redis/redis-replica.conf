# Redis Replica Configuration for ExamPulse
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 4096
timeout 0
tcp-keepalive 300

# Replicate from redis-master container
replicaof redis-master 6379
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60

# AOF on replica for failover persistence
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec

dir /data
loglevel notice
